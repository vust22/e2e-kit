# Versioning and publishing (spec §10).
#
# Push to main -> changesets maintains a "Version Packages" PR. Merging that PR publishes.
#
# Packages publish as `@vust22/*` because GitHub Packages requires the scope to match the repository
# owner, but every source import in this repo stays `@invertus/*`. scripts/prepare-publish.mjs does
# that remap on a staged copy at publish time (DECISIONS.md D-025) — nothing in `src` knows about it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'

      - run: npm ci
      - run: npx tsc --build
      - run: npm run test:unit

      # Opens or updates the "Version Packages" PR while changesets are pending; once that PR merges
      # and no changesets remain, `publish` runs instead.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: node scripts/publish-all.mjs
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An immutable `v<version>` tag per package release (§10), gated on OUR OWN result file rather
      # than `steps.changesets.outputs.published`. That output is derived by parsing the publish
      # command's stdout for the `New tag:` lines `changeset publish` emits; publishing through a
      # staging directory (D-025) never produces them, so it is always false and this step silently
      # never ran on the first real release.
      - name: Tag the package release
        run: |
          set -euo pipefail
          if [ ! -f publish-result.json ]; then
            echo "no publish-result.json — the publish command did not run this time"
            exit 0
          fi
          published=$(node -p "require('./publish-result.json').published")
          version=$(node -p "require('./publish-result.json').version")
          if [ "$published" != "true" ]; then
            echo "nothing published; no version tag to create"
            exit 0
          fi
          echo "tagging v$version"
          git tag -f "v$version"
          git push -f origin "v$version"

      # The floating `v1` moves on EVERY successful main build, not only when packages publish
      # (DECISIONS.md D-029).
      #
      # Consumers pin `@v1` for the reusable *workflow*, which is code in this repository — not for the
      # published packages. Tying v1 to package publication froze it at a pre-fix commit while four
      # workflow bug fixes landed on main, so every consumer would have run the broken version. The two
      # things move on different cadences and need different tags: `v<version>` is the immutable package
      # release, `v1` is "the current v1-compatible state of the kit".
      - name: Move the floating v1 tag
        run: |
          set -euo pipefail
          git tag -f v1
          git push -f origin v1
          echo "v1 -> $(git rev-parse --short HEAD)"
