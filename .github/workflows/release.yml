# Versioning and publishing (spec §10).
#
# Push to main -> changesets maintains a "Version Packages" PR. Merging that PR publishes.
#
# Packages publish as `@vust22/*` because GitHub Packages requires the scope to match the repository
# owner, but every source import in this repo stays `@invertus/*`. scripts/prepare-publish.mjs does
# that remap on a staged copy at publish time (DECISIONS.md D-025) — nothing in `src` knows about it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'

      - run: npm ci
      - run: npx tsc --build
      - run: npm run test:unit

      # Opens or updates the "Version Packages" PR while changesets are pending; once that PR merges
      # and no changesets remain, `publish` runs instead.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: node scripts/publish-all.mjs
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # §10: an immutable `v<version>` tag per release, plus the floating `v1` consumers pin.
      #
      # Gated on OUR OWN result file, not `steps.changesets.outputs.published`. That output is derived
      # by parsing the publish command's stdout for the `New tag:` lines `changeset publish` emits;
      # publishing through a staging directory (D-025) never produces them, so the output is always
      # false and this step silently never ran on the first real release.
      - name: Tag the release and move the floating v1 tag
        run: |
          set -euo pipefail
          if [ ! -f publish-result.json ]; then
            echo "no publish-result.json — the publish command did not run this time"
            exit 0
          fi
          published=$(node -p "require('./publish-result.json').published")
          version=$(node -p "require('./publish-result.json').version")
          if [ "$published" != "true" ]; then
            echo "nothing was published; leaving tags alone"
            exit 0
          fi
          echo "tagging v$version and moving v1"
          git tag -f "v$version"
          git tag -f v1
          git push -f origin "v$version"
          git push -f origin v1
