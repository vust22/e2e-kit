# Apache configuration for the E2E image.

<Directory /var/www/html>
    # PrestaShop's friendly URLs (spec §4.1 item 4) are implemented in .htaccess,
    # which requires AllowOverride.
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# Keep the access log quiet for the healthcheck so container logs stay readable when a
# test fails and someone actually reads them.
SetEnvIf Request_URI "^/index\.php$" e2e_healthcheck
