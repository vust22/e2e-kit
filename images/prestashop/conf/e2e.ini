; PHP settings for the E2E image.

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = "Europe/Vilnius"

; Errors go to the container log, never into the HTML — a PHP notice rendered into the
; page would silently break locators and look like selector drift to the healing harness.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Spec §4.1 item 9 / §6.4 item 2: PHP HTTP clients must trust the kit's E2E CA so that
; mock services presenting provider-hostname certificates are accepted with zero module
; changes. Both settings point at the system bundle, into which the CA was installed.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; Deterministic timing.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
