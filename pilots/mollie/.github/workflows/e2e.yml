# File #1 of the "2-file adoption" (spec §5.1, §5.2).
#
# The whole CI integration for a consumer repo. Everything it does — booting the seeded image,
# building the module, running the matrix, publishing the report — lives in the kit's reusable
# workflow, so a kit release upgrades every consumer at once (Goal 1).
#
name: e2e

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '0 3 * * *'

# Declared explicitly because GitHub defaults GITHUB_TOKEN to read-only on many repositories (always
# on forks). A called workflow cannot exceed what its caller was granted, so without this the run fails
# at startup with no jobs and no logs — see DECISIONS.md D-030.
#
# `pull-requests: write` is used only to post the run's summary comment.
permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  e2e:
    uses: invertus/e2e-kit/.github/workflows/e2e-reusable.yml@v1
    with:
      config-path: e2e/e2e.config.ts
    secrets: inherit
